services:
  supermarketlist:
    build: .
    image: supermarketlist:local
    container_name: supermarketlist
    # Rodava solto num terminal e caiu sem ninguém ver (2026-10-06, 502 no list.pado.app.br).
    # ./app traz código, sqlite.db e .secret_key; o usuário 1000 mantém o dono dos arquivos.
    # A 8989 fica publicada no host porque o Caddy (network_mode: host) só alcança 192.168.0.2:<porta>.
    user: "1000:1000"
    ports:
      - "8989:8989"
    volumes:
      - ./app:/srv/app
    environment:
      TZ: America/Sao_Paulo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
